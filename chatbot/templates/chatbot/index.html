<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAssist - IT Troubleshooting Chatbot</title>
    <!-- Tailwind CSS CDN for fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg font-bold text-white">IT</div>
            <div>
                <h1 class="font-bold text-lg text-white">TechAssist AI</h1>
                <p class="text-xs text-slate-400">Computer Technician Troubleshooting Expert</p>
            </div>
        </div>
        <span class="text-xs bg-emerald-900 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-700">Online</span>
    </header>

    <!-- Chat History Window -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <!-- Initial Welcome Message from Bot -->
        <div class="flex items-start space-x-3">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-xl text-sm leading-relaxed shadow-sm">
                Hello technician! I am your AI troubleshooting assistant. Type a hardware or software query below (e.g., <span class="text-blue-400 font-mono">"blue screen"</span>, <span class="text-blue-400 font-mono">"no wifi"</span>, <span class="text-blue-400 font-mono">"overheating"</span>, or <span class="text-blue-400 font-mono">"no power"</span>).
            </div>
        </div>
    </main>

    <!-- Input Footer Area -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Describe the technical issue (e.g., PC won't boot, blue screen error)..." 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100 placeholder-slate-500"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition text-sm flex items-center shadow-md">
                Send
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic for Handling Chat Interaction and Django CSRF -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        // Helper function to get Django CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // Append User Message to UI
            appendMessage(messageText, 'user');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append loading indicator or placeholder
            const loadingId = appendLoadingMessage();
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const csrftoken = getCookie('csrftoken');
                const response = await fetch("", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrftoken
                    },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                // Remove loading message
                document.getElementById(loadingId).remove();

                if (data.response) {
                    appendMessage(data.response, 'bot');
                } else if (data.error) {
                    appendMessage("Error: " + data.error, 'bot');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage("Network error occurred while connecting to Django backend.", 'bot');
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0 ${isUser ? 'bg-slate-700 text-slate-200' : 'bg-blue-600 text-white'}`;
            avatar.textContent = isUser ? 'You' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = `border p-4 rounded-2xl max-w-xl text-sm leading-relaxed shadow-sm whitespace-pre-line ${
                isUser 
                    ? 'bg-blue-600 border-blue-500 text-white' 
                    : 'bg-slate-800 border-slate-700 text-slate-100'
            }`;
            bubble.textContent = text;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
        }

        function appendLoadingMessage() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex items-start space-x-3';

            const avatar = document.createElement('div');
            avatar.className = 'bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0';
            avatar.textContent = 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bg-slate-800 border border-slate-700 p-4 rounded-2xl text-sm text-slate-400 italic animate-pulse';
            bubble.textContent = 'Analyzing diagnostic logs and knowledge base...';

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            return id;
        }
    </script>
</body>
</html>
